name: Release rehearsal

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing backend/frontend image tag to rehearse
        required: true
        default: v0.5.9
        type: string
      source_ref:
        description: Git ref containing the deployment bundle to test
        required: true
        default: dev
        type: string

permissions:
  contents: read
  packages: read

env:
  BACKEND_REPOSITORY: ghcr.io/natimys/fuze-backend
  FRONTEND_REPOSITORY: ghcr.io/natimys/fuze-frontend

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and pull published images
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          backend_digest="$(docker buildx imagetools inspect "${BACKEND_REPOSITORY}:${IMAGE_TAG}" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          frontend_digest="$(docker buildx imagetools inspect "${FRONTEND_REPOSITORY}:${IMAGE_TAG}" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          [[ "$backend_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$frontend_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "${BACKEND_REPOSITORY}@${backend_digest}"
          docker pull "${FRONTEND_REPOSITORY}@${frontend_digest}"
          printf 'BACKEND_IMAGE=%s@%s\nFRONTEND_IMAGE=%s@%s\n' \
            "$BACKEND_REPOSITORY" "$backend_digest" \
            "$FRONTEND_REPOSITORY" "$frontend_digest" > "$RUNNER_TEMP/release-images.env"

      - name: Prepare deployment bundle
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          cp -a deploy/bundle release-bundle
          printf '%s\n' "$IMAGE_TAG" > release-bundle/VERSION
          cp "$RUNNER_TEMP/release-images.env" release-bundle/.env.release
          cp release-bundle/.env.release release-bundle/.env
          cat >> release-bundle/.env <<'EOF'
          DB_NAME=fuze
          DB_USER=fuze
          APP_DOMAIN=fuze.example.com
          STORAGE_DOMAIN=media.example.com
          ACME_EMAIL=admin@example.com
          CORS_ORIGINS=["https://fuze.example.com"]
          CORS_ALLOW_CREDENTIALS=true
          CORS_ALLOW_METHODS=["*"]
          CORS_ALLOW_HEADERS=["*"]
          REFRESH_TOKEN_EXPIRES=30
          ACCESS_TOKEN_EXPIRES=15
          EOF
          mkdir -p release-bundle/secrets release-bundle/backups
          for name in postgres_password jwt_key config_encryption_key minio_root_access_key minio_root_secret_key minio_media_access_key minio_media_secret_key; do
            printf test-secret-value-at-least-32-characters > "release-bundle/secrets/$name"
          done
          printf fuze-root-test > release-bundle/secrets/minio_root_access_key
          printf fuze-media-test > release-bundle/secrets/minio_media_access_key
          (cd release-bundle && docker compose config >/dev/null)
          (cd release-bundle && docker compose -f compose.yaml -f compose.https.yaml config >/dev/null)

      - name: Fresh install and backup/restore rehearsal
        working-directory: release-bundle
        run: |
          docker compose pull postgres redis minio minio-init backup
          docker compose up -d --pull never
          for attempt in $(seq 1 60); do
            docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)" && break
            test "$attempt" -lt 60
            sleep 5
          done
          printf 'release-test-password\n' | docker compose run --rm backend fuze rescue bootstrap-admin --email admin@example.com --name 'Release Admin' --password-stdin
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/ >/dev/null
          curl --fail http://127.0.0.1:3000/api/v1/config | grep -q '"setup_required":false'
          archive="$(docker compose run --rm backup backup daily | tail -1)"
          test -f ".${archive}"
          docker compose stop frontend backend worker beat backup
          docker compose exec -T postgres psql -U fuze -d fuze -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          docker compose run --rm backup restore "$archive"
          docker compose up -d --pull never
          docker compose exec -T backend fuze rescue db-status --json | grep -q '"drift": false'

      - name: Show diagnostics
        if: failure()
        working-directory: release-bundle
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --timestamps || true

      - name: Clean up
        if: always()
        working-directory: release-bundle
        run: docker compose down -v --remove-orphans || true
